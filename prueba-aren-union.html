<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aren · Guardián de los Cinco Cristales</title>
  <link rel="stylesheet" href="css/aren-union-preview.css">
</head>
<body>
  <header><p>AREN · TRANSFORMACIÓN DE LA UNIÓN</p><h1>Guardián de los Cinco Cristales</h1><span>Prueba visual del traje, la capa y las cinemáticas</span></header>
  <main>
    <section id="escena" class="escena" aria-label="Demostración de Aren y Azrak">
      <img class="union-rayo" src="assets/images/trajes/aren-union-rayo-v2.png" alt=""><div class="suelo"></div><div id="guardianes" class="guardianes" aria-hidden="true"></div>
      <svg class="energias" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true"><g id="rayos"></g></svg>
      <div id="aren" class="aren"><img class="capa" src="assets/images/trajes/aren-union-capa-v1.png" alt=""><img id="cuerpo" class="cuerpo" src="assets/images/trajes/aren-union-base-v1.png" alt="Aren con ropa de explorador y energía dorada"></div>
      <img id="rival" class="rival" src="assets/images/personajes/versus/azrak-base.png" alt="Azrak, rival de Aren">
      <img class="prision" src="assets/images/trajes/aren-union-prision-v2.png" alt="Prisión de cristal violeta que encierra al rival">
      <div id="cristales" class="cristales" aria-hidden="true"></div><div id="fragmentos" class="fragmentos" aria-hidden="true"></div><div class="destello"></div>
      <div class="rotulo"><small id="fase">EL PODER DE LA UNIÓN</small><strong id="titulo">Aren y su capa de energía</strong></div>
    </section>
    <nav aria-label="Pruebas del paquete"><button id="entrada">Ver entrada</button><button id="duelo">Ver capa en duelo</button><button id="ataque">Probar ataque</button><button id="remate">Juicio de los Cinco Cristales</button><button id="pausa" aria-pressed="false">Pausar</button></nav>
    <p id="estado" role="status">La capa se mueve de forma independiente. Esta prueba no compra ni equipa contenido.</p>
  </main>
  <script src="js/aren-union-preview.js"></script>
</body>
</html>
